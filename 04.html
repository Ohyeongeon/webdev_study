<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3 {
            font: italic bold 40px consolas, self-serif;
        }
        #n{
            font-weight: 900;
        }
        #o{
            font-weight: 100;
        }
        body {
            font-family:'Times New Roman', Times, serif
        }
        #i{
            font-style: italic;
        }
        span{
            font-size: 1.5em;
        }
        #m{
            font-size: large;
        }
    </style>
</head>
<body>
    <h3>consolas font</h3>
    <hr>
    <p id = 'n'>font weight 900</p>
    <p id = 'o'>font weight 100</p>
    <p id = 'i'>italic style</p>
    <p style = 'font-style: oblique;'>oblique style</p>
    <p id = 'm'>현재 크기의<span> 1.5배 </span>크기로</p>
</body>
</html>
