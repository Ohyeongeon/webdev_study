<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문지</title>
</head>
<body>
    <header>
        <h1>설문지</h1>
        <h4>소프트웨어기술에 대한 의견을 듣습니다.많은 참여 부탁드립니다.</h4>
    </header>
    <hr>
    <section>
        <form>
            <p>학년
            <input type = 'radio' id = '1'name = '학년' value = '1학년'>
            <label for ='1'>1학년</label>
            <input type = 'radio' id = '2'name = '학년' value = '2학년'>
            <label for ='2'>2학년</label>
            <input type = 'radio' id = '3'name = '학년' value = '3학년'>
            <label for ='3'>3학년</label>
            <input type = 'radio' id = '4' name = '학년' value = '4학년'>
            <label for ='4'>4학년</label>
            </p>
        </form>
        <form>
            <p> 성별
            <input type = 'radio' id = 'm' name = '성별' value = '남자'>
            <label for = 'm'>남자</label>
            <input type = 'radio' id = 'f' name = '성별' value = '여자'>
            <label for = 'm'>여자</label>
            </p>
        </form>
        <form>
            <p>관심 분야
                <select name = '진로 분야'>
                    <option>모바일 소프트웨어</option>
                    <option>모바일 소프트웨어</option>
                    <option>모바일 소프트웨어</option>
                </select>
            </p>
        </form>
        <form>
            <p>진로
                <input type = 'checkbox' id  = '개발' name = '진로' value = '개발'>
                <label for = '개발'>개발</label>
                <input type = 'checkbox' id  = '기획' name = '진로' value = '기획'>
                <label for = '기획'>기획</label>
                <input type = 'checkbox' id  = '영업' name = '진로' value = '영업'>
                <label for = '영업'>영업</label>
                <input type = 'checkbox' id  = '창업' name = '진로' value = '창업'>
                <label for = '창업'>창업</label>
            </p>
        </form>
        <p>남기고 싶은 말</p>
            <textarea name = '글을 남겨주세요' rows = '10' cols = '50' placeholder="글을 남겨주세요."></textarea>
    </section>
    <footer>
        <p>Copyright 2025 by 오현건</p>
    </footer>
</body>
</html>
