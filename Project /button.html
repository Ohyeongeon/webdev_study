<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button{
            width: 150px;
            height: 70px;
            background-color: orange;
            border-radius: 30px;
            border: 10px solid #ffffff;
            box-shadow: 5px 5px 5px #a9a9a9; 
        }
        .a{
            font-size: 2em;
            font-style: italic;
            font-weight: bold;
            text-align: center;
        }
        .button > a{
            display: block;
        }
    </style>
</head>
<body>
    <div class ='button'><a href="#" class = 'a'>Click</a></div>
</body>
</html>
