<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-size: 90px;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            font-style: italic;
        }

    </style>
</head>
<body>
    <h1 id = 'hi'>To Do List</h1>
    <h2 id = 'num'>0</h2>
    <input id = 'name' type = 'text' placeholder="할 일 입력" onkeyup = 'if(window.event.keyCode == 13){todo()}'>
    <button onclick = "todo()">추가</button>
    <ul id = 'ul'>
        
    </ul>
    <script>
        let count = 0;
        function todo(){
            const input = document.querySelector('input');
            const ul = document.querySelector('ul');
            const cnt = document.querySelector('#num');

            if (input.value == ''){
                return;
            }

            const li = document.createElement('li');
            li.textContent = input.value;
            ul.appendChild(li);
            input.value = '';

            count++;
            cnt.textContent = '할 일 개수 ' + count;
        }
    </script>
</body>
</html>
